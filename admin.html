<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物流信息后台编辑 | GREENLINE</title>
<link rel="icon" type="image/png" href="assets/logo.png?v=202607251754">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;background:#f3ede3;color:#3a2a1a;padding:28px 18px;line-height:1.6;}
  .wrap{max-width:760px;margin:0 auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08);}
  h1{font-size:22px;margin-bottom:6px;}
  .tip{font-size:13px;color:#6b5640;margin-bottom:22px;background:#faf6ef;border:1px solid #ece2d2;border-radius:8px;padding:12px 14px;}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
  input,textarea{width:100%;padding:11px 12px;border:1px solid #d8ccb8;border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{min-height:110px;resize:vertical;}
  .btn{display:inline-block;background:#c9a26b;color:#2a1c10;border:none;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin:14px 8px 0 0;}
  .btn:hover{background:#bb924f;}
  .btn.ghost{background:#fff;color:#9a6b2f;border:1px solid #c9a26b;}
  .list{margin-top:22px;border-top:1px solid #eee;padding-top:16px;}
  .item{border:1px solid #ece2d2;border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#faf9f5;}
  .item .c{font-weight:700;color:#9a6b2f;font-size:13px;}
  .item .t{white-space:pre-wrap;font-size:14px;margin-top:4px;}
  .item button{margin-top:8px;font-size:12px;color:#a33;background:none;border:1px solid #d9b3b3;border-radius:6px;padding:4px 10px;cursor:pointer;}
  h2{font-size:16px;margin-top:26px;}
  code{background:#f0e9dd;padding:2px 6px;border-radius:4px;font-size:13px;}
  .hidden-file{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>物流信息后台编辑</h1>
  <div class="tip">
    使用说明：在下方填写「单号」和「信息」，点「添加到列表」。可继续添加多条。
    全部填好后点「导出 track-data.json」下载文件，再把该文件上传/替换到网站仓库（或交给技术同事推送）。
    客户在前台 <code>track.html</code> 输入对应单号即可看到这些信息。
  </div>

  <label>单号（客户在前台输入的那个）</label>
  <input id="code" placeholder="例如 GL2026-001">

  <label>信息（由后台人员编写，支持换行）</label>
  <textarea id="info" placeholder="例如：您的货物已于...装船，预计...抵达...。"></textarea>

  <label>更新日期（可选，默认今天）</label>
  <input id="updated" type="date">

  <div>
    <button class="btn" id="addBtn">添加到列表</button>
    <button class="btn ghost" id="importBtn">导入现有 JSON</button>
    <button class="btn" id="exportBtn">导出 track-data.json</button>
  </div>
  <input type="file" id="fileInput" class="hidden-file" accept=".json">

  <div class="list" id="list"></div>

  <h2>如何发布到网站</h2>
  <p style="font-size:13px;color:#6b5640;">
    方式一（最简单）：把导出的 <code>track-data.json</code> 发给技术同事，由其在仓库里替换同名文件并推送。<br>
    方式二（有 GitHub 权限）：打开仓库文件
    <code>track-data.json</code> 直接编辑/上传，提交后即生效（通常 1 分钟内）。
  </p>
</div>

<script>
  var KEY = 'greenline_track_entries';
  var entries = [];

  function load(){ try{ entries = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ entries = []; } render(); }
  function save(){ localStorage.setItem(KEY, JSON.stringify(entries)); }

  function render(){
    var box = document.getElementById('list');
    if(entries.length === 0){ box.innerHTML = '<p style="color:#8a7a64;font-size:13px;">（暂无记录）</p>'; return; }
    box.innerHTML = entries.map(function(e, i){
      return '<div class="item"><div class="c">'+escapeHtml(e.code)+'</div><div class="t">'+escapeHtml(e.info)+'</div>'+
             (e.updated?'<div style="font-size:12px;color:#8a7a64;margin-top:4px;">更新：'+escapeHtml(e.updated)+'</div>':'')+
             '<button data-i="'+i+'">删除</button></div>';
    }).join('');
    box.querySelectorAll('button[data-i]').forEach(function(b){
      b.addEventListener('click', function(){ entries.splice(+b.dataset.i, 1); save(); render(); });
    });
  }

  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }

  document.getElementById('addBtn').addEventListener('click', function(){
    var code = document.getElementById('code').value.trim();
    var info = document.getElementById('info').value.trim();
    var updated = document.getElementById('updated').value;
    if(!code || !info){ alert('请填写单号和信息'); return; }
    var exist = entries.find(function(e){ return e.code.toLowerCase() === code.toLowerCase(); });
    if(exist){ if(!confirm('该单号已存在，是否覆盖？')) return; exist.info = info; exist.updated = updated || exist.updated; }
    else { entries.push({ code: code, info: info, updated: updated }); }
    save(); render();
    document.getElementById('code').value=''; document.getElementById('info').value=''; document.getElementById('updated').value='';
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var data = { entries: entries };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'track-data.json';
    a.click();
  });

  document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('fileInput').click(); });
  document.getElementById('fileInput').addEventListener('change', function(ev){
    var f = ev.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(r.result);
        if(confirm('导入后将替换当前列表，确定？')){ entries = d.entries || []; save(); render(); }
      }catch(e){ alert('JSON 解析失败'); }
    };
    r.readAsText(f);
  });

  // 默认日期为今天
  document.getElementById('updated').value = new Date().toISOString().slice(0,10);
  load();
</script>
</body>
</html>
