<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogues · GREENLINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <style>
    :root{
      --c-primary:#C8965C; --c-primary-h:#DCAA6E; --c-primary-d:#8C5E3C;
      --c-accent:#6B3A2A; --c-bg-card:#3E281C; --c-text:#FFF8F0;
      --c-text-dim:#D4C4B0; --c-text-muted:#A89480;
      --c-border:rgba(200,150,92,0.12); --radius-md:12px; --radius-sm:6px;
      --font-body:'Inter','PingFang SC','Microsoft YaHei',sans-serif;
      --font-display:'Playfair Display','Noto Serif SC',serif;
      --ease:cubic-bezier(0.22,0.61,0.36,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:var(--font-body);color:var(--c-text);min-height:100vh;
      background:radial-gradient(1200px 600px at 80% -10%, rgba(200,150,92,0.10), transparent 60%),
                 linear-gradient(160deg,#23150C 0%,#1A0F08 100%);
      display:flex;flex-direction:column;
    }
    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:22px 40px;border-bottom:1px solid var(--c-border);
    }
    .brand{font-family:var(--font-display);font-weight:800;font-size:1.4rem;
      letter-spacing:1px;color:var(--c-primary)}
    .back{
      display:inline-flex;align-items:center;gap:8px;text-decoration:none;
      font-size:0.9rem;color:var(--c-text-dim);border:1px solid rgba(200,150,92,0.18);
      padding:9px 18px;border-radius:50px;transition:all .3s var(--ease);
    }
    .back:hover{color:var(--c-primary);border-color:var(--c-primary);transform:translateY(-1px)}
    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .card{
      max-width:560px;width:100%;text-align:center;
      background:var(--c-bg-card);border:1px solid var(--c-border);
      border-radius:var(--radius-md);padding:56px 44px;
      box-shadow:0 30px 80px rgba(0,0,0,0.35);
    }
    .card-icon{font-size:3.2rem;margin-bottom:18px;filter:drop-shadow(0 6px 18px rgba(200,150,92,0.25))}
    .card h1{font-family:var(--font-display);font-size:2rem;color:var(--c-text);margin-bottom:14px}
    .card p{color:var(--c-text-dim);line-height:1.8;font-size:1rem;margin-bottom:8px}
    .card .muted{color:var(--c-text-muted);font-size:0.86rem;margin-top:18px}
    .cat-tag{
      display:inline-block;margin-top:18px;padding:8px 18px;border-radius:50px;
      background:rgba(200,150,92,0.1);border:1px solid rgba(200,150,92,0.22);
      color:var(--c-primary);font-weight:600;font-size:0.85rem;letter-spacing:0.5px;
    }
    .cta{
      display:inline-block;margin-top:28px;padding:14px 34px;border-radius:50px;text-decoration:none;
      background:var(--c-primary);color:#2A1810;font-weight:700;font-size:0.95rem;
      transition:all .3s var(--ease);
    }
    .cta:hover{background:var(--c-primary-h);transform:translateY(-2px);box-shadow:0 8px 30px rgba(200,150,92,0.3)}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">GREENLINE</div>
    <a class="back" href="index.html">← Back to Home</a>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="card-icon">📖</div>
      <h1>Product Catalogues</h1>
      <p>产品目录册页面正在准备中。</p>
      <p>This catalogue page is being prepared.</p>
      <div class="cat-tag" id="catTag" style="display:none"></div>
      <div class="muted">（占位页 · Placeholder — 老板发送正式目录册界面后，会替换此处）</div>
      <a class="cta" href="index.html">返回首页 · Back to Home</a>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var cat = params.get('cat');
    if (cat) {
      var tag = document.getElementById('catTag');
      tag.style.display = 'inline-block';
      tag.textContent = 'Category: ' + cat;
    }
  </script>
</body>
</html>
