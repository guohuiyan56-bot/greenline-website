name = "greenline-cosco-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 密钥请用以下命令注入（不要写进本文件，避免泄露）：
#   wrangler secret put COSCO_API_KEY
#   wrangler secret put COSCO_SECRET_KEY
# 值来自 COP 门户（cop.lines.coscoshipping.com）审核通过后发到你邮箱的 ApiKey / SecretKey

# 免费版即可，无需额外配置。路由可自行在 Cloudflare 控制台设置。
