<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物流追踪 | GREENLINE</title>
<meta name="description" content="GREENLINE 物流追踪 — 输入快递单号，在站内实时查询全球 3300+ 承运商的物流轨迹。">
<link rel="icon" type="image/png" href="assets/logo.png?v=202607251754">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;background:#f3ede3;color:#3a2a1a;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:#2a1c10;}
  .logo{color:#fff;font-size:20px;font-weight:800;letter-spacing:2px;text-decoration:none;}
  .logo b{color:#c9a26b;}
  .lang-btn{background:transparent;color:#c9a26b;border:1px solid #c9a26b;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;}
  .lang-btn:hover{background:#c9a26b;color:#2a1c10;}
  .main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;}
  .card{background:#fff;border-radius:14px;padding:34px;max-width:680px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .icon{font-size:34px;}
  h1{font-size:24px;margin:8px 0 4px;}
  .sub{color:#6b5640;font-size:14px;margin-bottom:22px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  input{width:100%;padding:13px 14px;border:1px solid #d8ccb8;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:#3a2a1a;}
  input:focus{outline:none;border-color:#c9a26b;}
  button.track-btn{width:100%;background:#c9a26b;color:#2a1c10;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;}
  button.track-btn:hover{background:#bb924f;}
  #YQContainer{min-height:140px;margin-top:22px;border-top:1px solid #eee;padding-top:18px;}
  #YQContainer:empty{display:none;}
  #YQContainer:empty + .hint{margin-top:0;}
  .hint{font-size:12px;color:#8a7a64;margin-top:18px;text-align:center;line-height:1.7;}
  .hint a{color:#9a6b2f;text-decoration:none;}
  .hint a:hover{text-decoration:underline;}
  footer{text-align:center;padding:18px;font-size:12px;color:#8a7a64;}
  footer a{color:#9a6b2f;text-decoration:none;}
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="index.html">GREEN<b>LINE</b></a>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>

  <div class="main">
    <div class="card">
      <div class="icon">📦</div>
      <h1 data-cn="物流追踪" data-en="Track Your Shipment">物流追踪</h1>
      <div class="sub" data-cn="输入快递单号，下方实时显示物流轨迹（自动识别全球 3300+ 承运商）" data-en="Enter your tracking number — live status shows below (auto-detect 3300+ carriers)">输入快递单号，下方实时显示物流轨迹（自动识别全球 3300+ 承运商）</div>

      <form id="trackForm" onsubmit="return false;">
        <div class="field">
          <label data-cn="快递单号" data-en="Tracking Number">快递单号</label>
          <input id="tn" type="text" autocomplete="off" data-ph-cn="请输入单号，如 1234567890" data-ph-en="Enter tracking No., e.g. 1234567890" placeholder="请输入单号，如 1234567890">
        </div>
        <button class="track-btn" id="trackBtn" data-cn="查询物流 →" data-en="Track →">查询物流 →</button>
      </form>

      <div id="YQContainer"></div>

      <div class="hint">
        <span data-cn="轨迹由 17TRACK 提供 · 若下方无显示，可" data-en="Powered by 17TRACK · if nothing shows below, ">轨迹由 17TRACK 提供 · 若下方无显示，可</span><a id="altLink" href="https://www.17track.net/track" target="_blank" rel="noopener" data-cn="在 17TRACK 官网查看" data-en="view on 17TRACK website">在 17TRACK 官网查看</a>
      </div>
    </div>
  </div>

  <footer>
    GREENLINE · <a href="index.html">返回官网首页</a> · 全球贸易，安心送达
  </footer>

<script>
  var lang = 'cn';

  function applyLang(){
    document.querySelectorAll('[data-cn]').forEach(function(el){
      el.textContent = (lang === 'cn') ? el.dataset.cn : el.dataset.en;
    });
    document.querySelectorAll('[data-ph-cn]').forEach(function(el){
      el.placeholder = (lang === 'cn') ? el.dataset.phCn : el.dataset.phEn;
    });
    var lb = document.getElementById('langBtn');
    lb.textContent = (lang === 'cn') ? 'EN' : '中文';
    document.title = (lang === 'cn') ? '物流追踪 | GREENLINE' : 'Track Shipment | GREENLINE';
    updateAltLink();
  }

  function updateAltLink(){
    var num = document.getElementById('tn').value.trim();
    var base = 'https://www.17track.net/track?nums=' + encodeURIComponent(num || '');
    base += (lang === 'cn') ? '&lang=zh-cn' : '&lang=en';
    document.getElementById('altLink').href = base;
  }

  function doTrack(){
    var num = document.getElementById('tn').value.trim();
    if(!num){
      alert((lang === 'cn') ? '请输入快递单号' : 'Please enter a tracking number');
      return;
    }
    updateAltLink();
    // 17TRACK 公开 Widget：在站内直接渲染轨迹，无需 API key
    if(typeof YQV5 === 'undefined'){
      // 脚本未加载时优雅降级到官网
      window.open(document.getElementById('altLink').href, '_blank');
      return;
    }
    YQV5.trackSingle({
      YQ_ContainerId: "YQContainer",
      YQ_Height: 600,
      YQ_Fc: "0",                       // 0 = 自动识别承运商
      YQ_Lang: (lang === 'cn') ? 'zh-cn' : 'en',
      YQ_Num: num
    });
  }

  document.getElementById('langBtn').addEventListener('click', function(){
    lang = (lang === 'cn') ? 'en' : 'cn';
    applyLang();
  });
  document.getElementById('trackBtn').addEventListener('click', doTrack);
  document.getElementById('trackForm').addEventListener('submit', function(e){ e.preventDefault(); doTrack(); });
  document.getElementById('tn').addEventListener('input', updateAltLink);
  document.getElementById('tn').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); doTrack(); }
  });

  applyLang();
</script>
<script type="text/javascript" src="//www.17track.net/externalcall.js"></script>
</body>
</html>
