<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物流追踪 | GREENLINE</title>
<meta name="description" content="GREENLINE 物流追踪 — 输入单号，查看由我司后台编写的货物运输信息。">
<link rel="icon" type="image/png" href="assets/logo.png?v=202607251754">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif;background:#f3ede3;color:#3a2a1a;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:#2a1c10;}
  .logo{color:#fff;font-size:20px;font-weight:800;letter-spacing:2px;text-decoration:none;}
  .logo b{color:#c9a26b;}
  .lang-btn{background:transparent;color:#c9a26b;border:1px solid #c9a26b;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;}
  .lang-btn:hover{background:#c9a26b;color:#2a1c10;}
  .main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;}
  .card{background:#fff;border-radius:14px;padding:34px;max-width:720px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .icon{font-size:34px;}
  h1{font-size:24px;margin:8px 0 4px;}
  .sub{color:#6b5640;font-size:14px;margin-bottom:24px;line-height:1.7;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  input,textarea{width:100%;padding:13px 14px;border:1px solid #d8ccb8;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:#3a2a1a;}
  input:focus,textarea:focus{outline:none;border-color:#c9a26b;}
  button.track-btn{width:100%;background:#c9a26b;color:#2a1c10;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;}
  button.track-btn:hover{background:#bb924f;}
  #result{margin-top:24px;border-top:1px solid #eee;padding-top:20px;}
  #result:empty{display:none;}
  .r-code{font-size:13px;color:#9a6b2f;font-weight:700;margin-bottom:10px;}
  .r-info{font-size:15px;line-height:1.9;white-space:pre-wrap;color:#3a2a1a;background:#faf6ef;border:1px solid #ece2d2;border-radius:8px;padding:16px;}
  .r-date{font-size:12px;color:#8a7a64;margin-top:10px;}
  .r-err{color:#a33;font-size:14px;line-height:1.8;}
  .r-loading{color:#9a6b2f;font-size:14px;}
  .hint{font-size:12px;color:#8a7a64;margin-top:18px;text-align:center;line-height:1.7;}
  footer{text-align:center;padding:18px;font-size:12px;color:#8a7a64;}
  footer a{color:#9a6b2f;text-decoration:none;}
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="index.html">GREEN<b>LINE</b></a>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>

  <div class="main">
    <div class="card">
      <div class="icon">📦</div>
      <h1 data-cn="物流追踪" data-en="Shipment Tracking">物流追踪</h1>
      <div class="sub" data-cn="请输入您的单号，查看由我司后台编写的货物运输信息。" data-en="Enter your tracking number to view the shipment info prepared by our team.">请输入您的单号，查看由我司后台编写的货物运输信息。</div>

      <form id="trackForm" onsubmit="return false;">
        <div class="field">
          <label data-cn="单号" data-en="Tracking Number">单号</label>
          <input id="code" type="text" autocomplete="off" data-ph-cn="请输入您的单号" data-ph-en="Enter your tracking number" placeholder="请输入您的单号">
        </div>
        <button class="track-btn" id="trackBtn" data-cn="查询 →" data-en="Track →">查询 →</button>
      </form>

      <div id="result"></div>

      <div class="hint">
        <span data-cn="未查询到？请核对单号，或联系我们：" data-en="Not found? Check the number or contact us: ">未查询到？请核对单号，或联系我们：</span>
        <a href="mailto:info@greenlineint.com">info@greenlineint.com</a>
      </div>
    </div>
  </div>

  <footer>
    GREENLINE · <a href="index.html">返回官网首页</a> · 全球贸易，安心送达
  </footer>

<script>
  // 数据文件：后台人员维护 track-data.json（同目录）
  var DATA_FILE = 'track-data.json';

  var lang = 'cn';

  function applyLang(){
    document.querySelectorAll('[data-cn]').forEach(function(el){
      el.textContent = (lang === 'cn') ? el.dataset.cn : el.dataset.en;
    });
    document.querySelectorAll('[data-ph-cn]').forEach(function(el){
      el.placeholder = (lang === 'cn') ? el.dataset.phCn : el.dataset.phEn;
    });
    document.getElementById('langBtn').textContent = (lang === 'cn') ? 'EN' : '中文';
    document.title = (lang === 'cn') ? '物流追踪 | GREENLINE' : 'Shipment Tracking | GREENLINE';
  }

  function setResult(html){ document.getElementById('result').innerHTML = html; }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
    });
  }

  async function doTrack(){
    var code = document.getElementById('code').value.trim();
    if(!code){
      setResult('<div class="r-err">' + ((lang==='cn')?'请输入单号':'Please enter a tracking number') + '</div>');
      return;
    }
    setResult('<div class="r-loading">' + ((lang==='cn')?'查询中…':'Searching…') + '</div>');
    try{
      var res = await fetch(DATA_FILE + '?t=' + Date.now());
      if(!res.ok){ setResult('<div class="r-err">' + ((lang==='cn')?'数据文件未找到。':'Data file not found.') + '</div>'); return; }
      var data = await res.json();
      var entries = (data && data.entries) || [];
      var hit = entries.find(function(e){
        return String(e.code || '').trim().toLowerCase() === code.toLowerCase();
      });
      if(!hit){
        setResult('<div class="r-err">' + ((lang==='cn')?'未查询到该单号的信息，请核对单号或联系我们。':'No info found for this number. Please check or contact us.') + '</div>');
        return;
      }
      var html = '';
      html += '<div class="r-code">' + escapeHtml(hit.code) + '</div>';
      html += '<div class="r-info">' + escapeHtml(hit.info || '') + '</div>';
      if(hit.updated) html += '<div class="r-date">' + ((lang==='cn')?'更新于 ':'Updated: ') + escapeHtml(hit.updated) + '</div>';
      setResult(html);
    }catch(e){
      setResult('<div class="r-err">' + ((lang==='cn')?'查询失败：'+(e.message||e):'Query failed: '+(e.message||e)) + '</div>');
    }
  }

  document.getElementById('langBtn').addEventListener('click', function(){
    lang = (lang === 'cn') ? 'en' : 'cn';
    applyLang();
  });
  document.getElementById('trackBtn').addEventListener('click', doTrack);
  document.getElementById('trackForm').addEventListener('submit', function(e){ e.preventDefault(); doTrack(); });
  document.getElementById('code').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); doTrack(); } });

  applyLang();
</script>
</body>
</html>
