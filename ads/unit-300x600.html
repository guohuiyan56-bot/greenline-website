<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREENLINE Ad 300x600</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  a.ad{display:block;position:relative;width:300px;height:600px;overflow:hidden;text-decoration:none;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer;}
  .bg{position:absolute;inset:0;background:#2a1c10 url('img/ad-bathroom.png') center/cover no-repeat;}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,6,.15) 0%,rgba(20,12,6,.35) 45%,rgba(20,12,6,.88) 100%);}
  .content{position:absolute;inset:0;padding:22px 20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;}
  .logo{font-size:22px;font-weight:800;letter-spacing:2px;}
  .logo b{color:#c9a26b;}
  .mid{margin-top:auto;}
  .slogan{font-size:22px;font-weight:700;line-height:1.25;}
  .sub{font-size:13px;opacity:.9;margin-top:10px;line-height:1.4;}
  .cta{display:inline-block;align-self:flex-start;background:#c9a26b;color:#2a1c10;font-size:15px;font-weight:700;padding:10px 20px;border-radius:4px;margin-top:18px;}
</style>
</head>
<body>
<a class="ad" href="https://www.greenlineint.com" target="_blank" rel="noopener">
  <div class="bg"></div><div class="overlay"></div>
  <div class="content">
    <div class="logo">GREEN<b>LINE</b></div>
    <div class="mid">
      <div class="slogan">Luxury Bath &amp; Building Supplies</div>
      <div class="sub">Trusted by importers &amp; contractors worldwide. Explore our full catalogue online.</div>
      <div class="cta">Explore Now &rarr;</div>
    </div>
  </div>
</a>
</body>
</html>
