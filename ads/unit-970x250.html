<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREENLINE Ad 970x250</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  a.ad{display:block;position:relative;width:970px;height:250px;overflow:hidden;text-decoration:none;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer;}
  .bg{position:absolute;inset:0;background:#2a1c10 url('img/ad-materials.png') right center/cover no-repeat;}
  .overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,12,6,.9) 0%,rgba(20,12,6,.6) 40%,rgba(20,12,6,.05) 100%);}
  .content{position:absolute;inset:0;padding:0 48px;display:flex;flex-direction:column;justify-content:center;color:#fff;max-width:620px;}
  .logo{font-size:30px;font-weight:800;letter-spacing:3px;margin-bottom:14px;}
  .logo b{color:#c9a26b;}
  .slogan{font-size:30px;font-weight:700;line-height:1.2;}
  .sub{font-size:16px;opacity:.9;margin-top:12px;}
  .cta{display:inline-block;align-self:flex-start;background:#c9a26b;color:#2a1c10;font-size:17px;font-weight:700;padding:12px 26px;border-radius:4px;margin-top:20px;}
</style>
</head>
<body>
<a class="ad" href="https://www.greenlineint.com" target="_blank" rel="noopener">
  <div class="bg"></div><div class="overlay"></div>
  <div class="content">
    <div class="logo">GREEN<b>LINE</b></div>
    <div class="slogan">Your Trusted Global Trade Partner</div>
    <div class="sub">Premium cabinets, bathware &amp; building materials for importers worldwide.</div>
    <div class="cta">Explore Now &rarr;</div>
  </div>
</a>
</body>
</html>
