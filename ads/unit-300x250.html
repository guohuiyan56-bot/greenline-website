<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREENLINE Ad 300x250</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  a.ad{display:block;position:relative;width:300px;height:250px;overflow:hidden;text-decoration:none;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer;}
  .bg{position:absolute;inset:0;background:#2a1c10 url('img/ad-kitchen.png') center/cover no-repeat;}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,6,.12) 0%,rgba(20,12,6,.80) 100%);}
  .content{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;}
  .logo{font-size:19px;font-weight:800;letter-spacing:2px;}
  .logo b{color:#c9a26b;}
  .slogan{font-size:14px;font-weight:600;line-height:1.3;}
  .sub{font-size:10px;opacity:.85;margin-top:5px;}
  .cta{display:inline-block;align-self:flex-start;background:#c9a26b;color:#2a1c10;font-size:12px;font-weight:700;padding:6px 13px;border-radius:3px;}
</style>
</head>
<body>
<a class="ad" href="https://www.greenlineint.com" target="_blank" rel="noopener">
  <div class="bg"></div><div class="overlay"></div>
  <div class="content">
    <div class="logo">GREEN<b>LINE</b></div>
    <div>
      <div class="slogan">Premium Cabinetry &amp; Building Materials</div>
      <div class="sub">Your trusted global trade partner</div>
    </div>
    <div class="cta">Explore Now &rarr;</div>
  </div>
</a>
</body>
</html>
