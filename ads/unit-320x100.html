<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREENLINE Ad 320x100</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  a.ad{display:block;position:relative;width:320px;height:100px;overflow:hidden;text-decoration:none;font-family:'Segoe UI',Arial,sans-serif;cursor:pointer;}
  .bg{position:absolute;inset:0;background:#2a1c10 url('img/ad-materials.png') right center/cover no-repeat;}
  .overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,12,6,.9) 0%,rgba(20,12,6,.5) 55%,rgba(20,12,6,.05) 100%);}
  .content{position:absolute;inset:0;padding:0 16px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;color:#fff;}
  .logo{font-size:16px;font-weight:800;letter-spacing:1px;white-space:nowrap;}
  .logo b{color:#c9a26b;}
  .slogan{font-size:13px;font-weight:600;flex:1;text-align:center;}
  .cta{display:inline-block;background:#c9a26b;color:#2a1c10;font-size:12px;font-weight:700;padding:7px 13px;border-radius:3px;white-space:nowrap;}
</style>
</head>
<body>
<a class="ad" href="https://www.greenlineint.com" target="_blank" rel="noopener">
  <div class="bg"></div><div class="overlay"></div>
  <div class="content">
    <div class="logo">GREEN<b>LINE</b></div>
    <div class="slogan">Premium Building Materials</div>
    <div class="cta">Explore &rarr;</div>
  </div>
</a>
</body>
</html>
