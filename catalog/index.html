<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREENLINE 目录册 | Catalogues</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #F7F3ED;
    --brown-dark: #3A261B;
    --brown-med: #6B4F3C;
    --brown-light: #A88C6C;
    --gold: #C9A66B;
    --text: #2C1E15;
    --text-light: #6D5A4D;
    --card: #FFFFFF;
  }
  html, body { min-height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Top bar —— 与翻书页同一套配色，视觉连续 */
  .topbar {
    height:62px; background: var(--brown-dark); color:#fff;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; position:sticky; top:0; z-index:100;
    box-shadow:0 2px 14px rgba(0,0,0,0.18);
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo { display:flex;align-items:center; }
  .logo-img { height:32px;width:auto;object-fit:contain; }
  .title-group { display:flex; flex-direction:column; line-height:1.25; }
  .title-main { font-size:15px; font-weight:600; letter-spacing:0.5px; }
  .title-sub { font-size:11px; opacity:0.75; font-weight:400; letter-spacing:0.4px; }
  .controls { display:flex; align-items:center; gap:8px; }
  .btn {
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
    color:#fff; padding:7px 12px; border-radius:6px; cursor:pointer;
    font-size:13px; transition: background .2s, border-color .2s, transform .1s;
    display:inline-flex; align-items:center; gap:6px; line-height:1; text-decoration:none;
  }
  .btn:hover { background:rgba(255,255,255,0.18); border-color:rgba(255,255,255,0.3); }
  .btn:active { transform: scale(0.96); }
  .btn svg { width:16px; height:16px; flex-shrink:0; }

  /* Layout */
  .wrap { max-width:1120px; margin:0 auto; padding:34px 24px 56px; }
  .page-head { margin-bottom:26px; }
  .page-head .eyebrow { font-size:12px; letter-spacing:2px; color: var(--gold); text-transform:uppercase; font-weight:700; }
  .page-head h1 { font-size:28px; font-weight:800; color: var(--brown-dark); margin-top:6px; letter-spacing:0.5px; }
  .page-head p { margin-top:8px; color: var(--text-light); font-size:14px; }

  .cat-group { margin-bottom:38px; }
  .cat-group-head { display:flex; align-items:baseline; gap:12px; margin-bottom:16px; border-bottom:2px solid var(--gold); padding-bottom:8px; }
  .cat-group-head .cn { font-size:19px; font-weight:700; color: var(--brown-dark); }
  .cat-group-head .en { font-size:12px; color: var(--text-light); letter-spacing:1px; text-transform:uppercase; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(248px, 1fr)); gap:20px; }

  .card {
    background: var(--card); border-radius:12px; overflow:hidden;
    border:1px solid rgba(58,38,27,0.08);
    box-shadow:0 6px 20px rgba(58,38,27,0.07);
    display:flex; flex-direction:column;
    transition: transform .22s var(--ease, ease), box-shadow .22s, border-color .22s;
    text-decoration:none; color:inherit;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 14px 34px rgba(58,38,27,0.15); border-color:rgba(201,166,107,0.5); }
  .card-cover { position:relative; aspect-ratio:0.6765; background:#EDE7DD; overflow:hidden; }
  .card-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-cover .pages { position:absolute; right:10px; bottom:10px; background:rgba(42,24,16,0.72); color:#fff; font-size:11px; padding:3px 9px; border-radius:20px; letter-spacing:0.4px; }
  .card-body { padding:15px 16px 18px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-title { font-size:16px; font-weight:700; color: var(--brown-dark); }
  .card-title-en { font-size:12px; color: var(--text-light); letter-spacing:0.3px; }
  .card-desc { font-size:13px; color: var(--text-light); margin-top:2px; line-height:1.5; }
  .card-cta { margin-top:auto; padding-top:12px; display:flex; align-items:center; gap:6px; color: var(--gold); font-weight:700; font-size:13px; }
  .card-cta svg { width:15px; height:15px; transition: transform .2s; }
  .card:hover .card-cta svg { transform: translateX(4px); }

  .empty { text-align:center; padding:70px 20px; color: var(--text-light); }
  .empty .ico { font-size:42px; opacity:0.5; }
  .empty p { margin-top:12px; font-size:15px; }

  @media (max-width: 768px) {
    .topbar { padding:0 12px; height:58px; }
    .logo { font-size:17px; }
    .title-main { font-size:13px; }
    .title-sub { display:none; }
    .btn span { display:none; }
    .wrap { padding:24px 16px 44px; }
    .page-head h1 { font-size:23px; }
    .grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:14px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="../index.html" class="logo"><img src="../assets/logo.png?v=20260725" alt="GREENLINE" class="logo-img"></a>
      <div class="title-group">
        <div class="title-main" id="topTitle">产品目录册</div>
        <div class="title-sub" id="topSub">Product Catalogues</div>
      </div>
    </div>
    <div class="controls">
      <a class="btn" id="btnHome" href="../index.html" title="返回首页">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
        <span>首页</span>
      </a>
      <button class="btn" id="btnLang" title="切换语言">
        <span id="langLabel">EN</span>
      </button>
    </div>
  </header>

  <div class="wrap">
    <div class="page-head">
      <div class="eyebrow" id="eyebrow">Catalogues</div>
      <h1 id="pageTitle">产品目录册</h1>
      <p id="pageDesc">选择一本目录册开始浏览</p>
    </div>
    <div id="content"></div>
  </div>

<script src="catalogs.js"></script>
<script>
(function () {
  var CATALOGS = window.CATALOGS || [];
  var CATS = window.CATALOG_CATS || {};
  var params = new URLSearchParams(location.search);
  var catParam = params.get('cat') || '';
  var lang = params.get('lang') === 'en' ? 'en' : (params.get('lang') === 'cn' ? 'cn' : 'cn');

  var T = {
    cn: {
      eyebrow: 'Catalogues',
      allTitle: '产品目录册',
      allDesc: '选择一本目录册开始浏览',
      groupOf: '栏目',
      openPrefix: '打开',
      backMain: '返回首页',
      empty: '该栏目暂未上传目录册',
      emptySub: '后续补充后会自动出现在这里',
      pages: '页'
    },
    en: {
      eyebrow: 'Catalogues',
      allTitle: 'Product Catalogues',
      allDesc: 'Choose a catalogue to start browsing',
      groupOf: 'Category',
      openPrefix: 'Open',
      backMain: 'Home',
      empty: 'No catalogue uploaded for this category yet',
      emptySub: 'It will appear here automatically once added',
      pages: 'pages'
    }
  };
  var t = T[lang];

  function catName(id) {
    var c = CATS[id];
    return c ? (lang === 'en' ? c.en : c.cn) : id;
  }
  function coverHtml(c) {
    var coverUrl = (lang === 'en' ? c.cover_en : c.cover_cn) || c.cover;
    var alt = lang === 'en' ? (c.title_en || c.title_cn) : (c.title_cn || c.title_en);
    return '<div class="card-cover"><img src="' + coverUrl + '" alt="' + alt + '" loading="lazy">'
      + '<span class="pages">' + (c.pages || '?') + ' ' + t.pages + '</span></div>';
  }
  function cardHtml(c) {
    return '<a class="card" href="' + c.folder + '/">'
      + coverHtml(c)
      + '<div class="card-body">'
        + '<div class="card-title">' + (lang === 'en' ? (c.title_en || c.title_cn) : c.title_cn) + '</div>'
        + '<div class="card-title-en">' + (lang === 'en' ? (c.title_cn || '') : (c.title_en || '')) + '</div>'
        + '<div class="card-desc">' + (lang === 'en' ? (c.desc_en || c.desc_cn) : c.desc_cn) + '</div>'
        + '<div class="card-cta">' + t.openPrefix
          + ' <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" fill="none"/></svg></div>'
      + '</div></a>';
  }
  function emptyHtml() {
    return '<div class="empty"><div class="ico">📂</div><p>' + t.empty + '</p><p style="margin-top:6px;font-size:13px;opacity:0.8">' + t.emptySub + '</p></div>';
  }

  function render() {
    t = T[lang];
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    document.getElementById('langLabel').textContent = lang === 'en' ? '中' : 'EN';

    if (catParam) {
      // 单栏目视图
      var list = CATALOGS.filter(function (c) { return c.category === catParam; });
      document.getElementById('topTitle').textContent = catName(catParam);
      document.getElementById('topSub').textContent = 'Catalogues';
      document.getElementById('eyebrow').textContent = t.groupOf;
      document.getElementById('pageTitle').textContent = catName(catParam) + ' · ' + (lang === 'en' ? 'Catalogues' : '目录册');
      document.getElementById('pageDesc').textContent = list.length
        ? (lang === 'en' ? list.length + ' catalogue(s) available' : '共 ' + list.length + ' 本目录册')
        : t.empty;
      document.getElementById('content').innerHTML = list.length
        ? '<div class="grid">' + list.map(cardHtml).join('') + '</div>'
        : emptyHtml();
    } else {
      // 全部视图：按栏目分组
      document.getElementById('topTitle').textContent = t.allTitle;
      document.getElementById('topSub').textContent = 'Catalogues';
      document.getElementById('eyebrow').textContent = t.eyebrow;
      document.getElementById('pageTitle').textContent = t.allTitle;
      document.getElementById('pageDesc').textContent = t.allDesc;
      var order = Object.keys(CATS);
      var html = '';
      order.forEach(function (cid) {
        var list = CATALOGS.filter(function (c) { return c.category === cid; });
        if (!list.length) return;
        html += '<div class="cat-group"><div class="cat-group-head">'
          + '<span class="cn">' + catName(cid) + '</span>'
          + '<span class="en">' + (CATS[cid] ? CATS[cid].en : cid) + '</span></div>'
          + '<div class="grid">' + list.map(cardHtml).join('') + '</div></div>';
      });
      document.getElementById('content').innerHTML = html || emptyHtml();
    }
  }

  document.getElementById('btnLang').addEventListener('click', function () {
    lang = lang === 'cn' ? 'en' : 'cn';
    var q = new URLSearchParams();
    if (catParam) q.set('cat', catParam);
    q.set('lang', lang);
    history.replaceState(null, '', '?' + q.toString());
    render();
  });

  render();
})();
</script>
</body>
</html>
