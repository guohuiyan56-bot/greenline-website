<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录册维护中 | GREENLINE</title>
<style>
  :root{--c-primary:#3A261B;--c-gold:#C8A35B;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#faf6f0,#f3e9da);
    font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--c-primary);}
  .card{text-align:center;padding:48px 40px;background:#fff;border-radius:18px;
    box-shadow:0 10px 40px rgba(58,38,27,0.12);max-width:460px;}
  .logo{font-size:2rem;font-weight:800;letter-spacing:2px;}
  .logo span{color:var(--c-gold);}
  .bar{width:48px;height:3px;background:var(--c-gold);margin:18px auto 22px;border-radius:2px;}
  h1{font-size:1.4rem;margin-bottom:10px;}
  p{color:#6b5746;line-height:1.7;font-size:.95rem;}
  .en{margin-top:14px;color:#9a8674;font-size:.85rem;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">GREEN<span>LINE</span></div>
    <div class="bar"></div>
    <h1>目录册暂时维护中</h1>
    <p>本栏目正在升级优化，暂时无法浏览，敬请期待全新版本。</p>
    <p class="en">Catalogues are temporarily under maintenance. Please check back soon.</p>
  </div>
</body>
</html>
