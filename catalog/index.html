<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREENLINE 家具站 · 目录册 Catalogues</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAaklEQVR4nO2QMQ0AIAjD+v9/duoNIwQWmZURVgQ3jqqqqup+1lr7eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXn4Btv4H1f0f3AAAAAElFTkSuQmCC">
<style>
:root{
  --bg:#F7F3ED; --brown-dark:#3A261B; --brown-med:#6B4F3C; --brown-light:#A88C6C;
  --gold:#C9A66B; --text:#2C1E15; --text-light:#6D5A4D; --card:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{height:64px;background:var(--brown-dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 14px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:14px}
.logo{font-size:21px;font-weight:800;color:var(--gold);letter-spacing:1.5px}
.brand-sub{font-size:13px;opacity:.8}
.controls{display:flex;align-items:center;gap:10px}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;text-decoration:none;transition:.2s}
.btn:hover{background:rgba(255,255,255,.18)}
.lang-btn{font-weight:700;min-width:42px}
.container{display:flex;max-width:1320px;margin:0 auto;gap:24px;padding:28px 24px}
.sidebar{width:210px;flex-shrink:0;align-self:flex-start;position:sticky;top:88px}
.sidebar h3{font-size:13px;color:var(--text-light);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.cat-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;cursor:pointer;margin-bottom:4px;font-size:14px;color:var(--text);transition:.18s;border-left:3px solid transparent}
.cat-item:hover{background:rgba(201,166,107,.12)}
.cat-item.active{background:rgba(201,166,107,.18);border-left-color:var(--gold);font-weight:600;color:var(--brown-dark)}
.cat-item .dot{width:7px;height:7px;border-radius:50%;background:var(--brown-light)}
.main{flex:1;min-width:0}
.heading{font-size:26px;font-weight:800;font-family:Georgia,"Times New Roman",serif;color:var(--brown-dark);margin-bottom:4px}
.sub{color:var(--text-light);font-size:14px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.cat-card{background:var(--card);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 6px 20px rgba(42,24,16,.08);transition:.22s;border:1px solid rgba(58,38,27,.08)}
.cat-card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(201,166,107,.28);border-color:var(--gold)}
.cat-card-img{aspect-ratio:0.6765;background:#efe9e0;overflow:hidden}
.cat-card-img img{width:100%;height:100%;object-fit:cover;display:block}
.cat-card-body{padding:14px 15px 16px}
.cat-card-tag{display:inline-block;font-size:11px;color:var(--brown-med);background:rgba(201,166,107,.16);padding:2px 9px;border-radius:20px;margin-bottom:8px}
.cat-card-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px}
.cat-card-meta{font-size:12px;color:var(--text-light)}
.cat-card-meta b{color:var(--gold)}
.empty{text-align:center;color:var(--text-light);padding:60px 0;font-size:15px}
@media(max-width:768px){.container{flex-direction:column;padding:18px}.sidebar{width:100%;position:static}.cat-list{display:flex;flex-wrap:wrap;gap:8px}.cat-item{margin:0}.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">GREENLINE</div><div class="brand-sub">GREENLINE 家具站 · 目录册</div></div>
  <div class="controls">
    <a class="btn" href="../index.html">← 返回首页 / Home</a>
    <button class="btn lang-btn" id="langBtn">EN</button>
  </div>
</header>
<div class="container">
  <aside class="sidebar"><h3 id="catTitle">分类 Categories</h3><div class="cat-list" id="catList"></div></aside>
  <main class="main">
    <div class="heading" id="mainHeading">全部目录册</div>
    <div class="sub" id="mainSub">All Catalogues</div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">暂无目录册 / No catalogues</div>
  </main>
</div>
<script>
var CATS = window.CATALOG_CATS || {"bathroom":{"cn":"卫浴","en":"Bathroom"},"door":{"cn":"门窗","en":"Doors & Windows"},"chair":{"cn":"座椅","en":"Chairs"},"hotel":{"cn":"酒店用品","en":"Hotel Supplies"},"decor":{"cn":"墙饰建材","en":"Wall Decor & Building"},"furniture":{"cn":"家具","en":"Furniture"},"outdoor":{"cn":"厨具户外","en":"Kitchen & Outdoor"}};
var CATALOGS = window.CATALOGS || [];
var lang = (new URLSearchParams(location.search).get('lang') || 'cn');
var activeCat = new URLSearchParams(location.search).get('cat') || '';
var catName = CATS;
function dc(o){return o&&o[lang]!==undefined?o[lang]:o;}
function renderCats(){
  var html='<div class="cat-item'+(activeCat===''?' active':'')+'" data-cat=""><span class="dot"></span>'+(lang==='cn'?'全部':'All')+'</div>';
  Object.keys(CATS).forEach(function(id){
    html+='<div class="cat-item'+(activeCat===id?' active':'')+'" data-cat="'+id+'"><span class="dot"></span>'+(lang==='cn'?CATS[id].cn:CATS[id].en)+'</div>';
  });
  document.getElementById('catList').innerHTML=html;
  document.querySelectorAll('.cat-item').forEach(function(it){
    it.addEventListener('click',function(){
      activeCat=this.getAttribute('data-cat')||'';
      var q=[]; if(activeCat)q.push('cat='+encodeURIComponent(activeCat)); q.push('lang='+lang);
      history.replaceState(null,'','?'+q.join('&'));
      renderCats(); renderGrid();
    });
  });
}
function renderGrid(){
  var list=CATALOGS.filter(function(c){return !activeCat||c.category===activeCat;});
  var grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML='';document.getElementById('empty').style.display='';return;}
  document.getElementById('empty').style.display='none';
  grid.innerHTML=list.map(function(c){
    var cov=(lang==='cn'?c.cover_cn:c.cover_en)||('./'+c.folder+'/cover_'+(lang==='cn'?'cn':'en')+'.jpg');
    var tag=catName[c.category]?dc(catName[c.category]):c.category;
    var title=lang==='cn'?c.title_cn:c.title_en;
    return '<a class="cat-card" href="./'+c.folder+'/index.html">'+
      '<div class="cat-card-img"><img src="'+cov+'" alt="'+title+'" decoding="async"></div>'+
      '<div class="cat-card-body"><span class="cat-card-tag">'+tag+'</span>'+
      '<div class="cat-card-title">'+title+'</div>'+
      '<div class="cat-card-meta"><b>'+(c.pages||0)+'</b> 页 · '+(lang==='cn'?'查看目录册':'View')+'</div></div></a>';
  }).join('');
  var h=document.getElementById('mainHeading'), s=document.getElementById('mainSub');
  if(activeCat&&catName[activeCat]){h.textContent=dc(catName[activeCat]);s.textContent=catName[activeCat].en+' · '+list.length+(lang==='cn'?' 本':' catalogues');}
  else{h.textContent=lang==='cn'?'全部目录册':'All Catalogues';s.textContent=(lang==='cn'?CATALOGS.length+' 本目录册':'All '+CATALOGS.length+' catalogues');}
}
function setLang(l){
  lang=l;
  document.getElementById('langBtn').textContent=l==='cn'?'EN':'中';
  var q=[]; if(activeCat)q.push('cat='+encodeURIComponent(activeCat)); q.push('lang='+lang);
  history.replaceState(null,'','?'+q.join('&'));
  document.getElementById('catTitle').textContent=l==='cn'?'分类 Categories':'Categories';
  renderCats(); renderGrid();
}
document.getElementById('langBtn').addEventListener('click',function(){setLang(lang==='cn'?'en':'cn');});
document.getElementById('langBtn').textContent=lang==='cn'?'EN':'中';
function boot(){
  var s=document.createElement('script');
  s.src='catalogs.js?_='+Date.now();
  s.onload=function(){
    if(window.CATALOGS&&window.CATALOGS.length)CATALOGS=window.CATALOGS;
    if(window.CATALOG_CATS)CATS=window.CATALOG_CATS;
    catName=CATS;
    renderCats();renderGrid();
  };
  s.onerror=function(){renderCats();renderGrid();};
  document.head.appendChild(s);
}
boot();
</script>
</body>
</html>
