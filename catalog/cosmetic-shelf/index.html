<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #F7F3ED; --brown-dark: #3A261B; --brown-med: #6B4F3C; --brown-light: #A88C6C;
    --gold: #C9A66B; --text: #2C1E15; --text-light: #6D5A4D;
  }
  html, body { height:100%; width:100%; overflow:hidden; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif; background:var(--bg); color:var(--text); }
  .app { display:flex; flex-direction:column; height:100vh; width:100vw; position:relative; }
  .topbar { height:62px; background:var(--brown-dark); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 22px; flex-shrink:0; box-shadow:0 2px 14px rgba(0,0,0,0.18); }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo { font-size:20px; font-weight:800; color:var(--gold); letter-spacing:1.5px; }
  .title-group { display:flex; flex-direction:column; line-height:1.25; }
  .title-main { font-size:15px; font-weight:600; letter-spacing:0.5px; }
  .title-sub { font-size:11px; opacity:0.75; font-weight:400; letter-spacing:0.4px; }
  .controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; padding:7px 12px; border-radius:6px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px; line-height:1; }
  .btn:hover { background:rgba(255,255,255,0.18); }
  .btn:disabled { opacity:0.35; cursor:default; }
  .btn svg { width:16px; height:16px; flex-shrink:0; }
  .page-group { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.15); border-radius:6px; padding:4px 8px; }
  .page-indicator { min-width:70px; text-align:center; font-variant-numeric:tabular-nums; font-size:14px; }
  .page-jump { width:58px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; border-radius:4px; padding:5px 4px; text-align:center; font-size:13px; outline:none; }
  .page-jump:focus { border-color:var(--gold); }
  .page-jump-btn { padding:6px 9px; font-size:12px; }
  .main { flex:1; display:flex; position:relative; overflow:hidden; }
  .flip-stage { flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding:2.5vh 4vw; max-width:1000px; margin:0 auto; }
  #book { width:100%; max-width:900px; max-height:92vh; margin:auto; }
  .drawer { position:fixed; top:62px; left:0; bottom:0; width:340px; max-width:86vw; background:rgba(255,255,255,0.97); backdrop-filter:blur(10px); box-shadow:2px 0 24px rgba(0,0,0,0.14); transform:translateX(-100%); transition:transform .32s; z-index:90; overflow-y:auto; padding:22px 24px 28px; }
  .drawer.open { transform:translateX(0); }
  .drawer h2 { font-size:18px; margin-bottom:18px; color:var(--brown-dark); border-bottom:2px solid var(--gold); padding-bottom:8px; }
  .thumb-rail { height:112px; background:#fff; border-top:1px solid rgba(0,0,0,0.08); display:flex; align-items:center; gap:10px; padding:10px 18px; overflow-x:auto; overflow-y:hidden; flex-shrink:0; }
  .thumb { flex:0 0 auto; width:132px; height:92px; border-radius:5px; overflow:hidden; cursor:pointer; border:2px solid transparent; opacity:0.65; background:#f5f5f5; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb.active { opacity:1; border-color:var(--gold); }
  .loader { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:200; transition:opacity .5s; }
  .loader.hidden { opacity:0; pointer-events:none; }
  .spinner { width:50px; height:50px; border:3px solid rgba(58,38,27,0.12); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loader p { margin-top:16px; color:var(--text-light); font-size:14px; }
  .lightbox { position:fixed; inset:0; background:rgba(14,9,6,0.97); z-index:300; display:none; flex-direction:column; }
  .lightbox.active { display:flex; }
  .lightbox-bar { height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; color:#fff; background:rgba(0,0,0,0.25); flex-shrink:0; }
  .lightbox-view { flex:1; overflow:auto; cursor:grab; display:flex; align-items:flex-start; justify-content:flex-start; }
  .lightbox-img { display:block; max-width:none; max-height:none; width:100vw; height:auto; }
</style>

<script>
(function(){
  const F = window.FLIP;
  const TOTAL_PAGES = F.total, IMAGES = F.images, THUMBS = F.thumbs, TOC = F.toc || [];
  let flip=null, currentPage=0, lightboxZoom=1, lightboxPage=0;
  const $=(id)=>document.getElementById(id);
  function preload(){
    var list = IMAGES.concat(THUMBS);
    return Promise.all(list.map(function(s){
      return new Promise(function(res){
        var img = new Image();
        img.onload = function(){ res(); };
        img.onerror = function(){ res(); };
        img.src = s;
      });
    }));
  }
  function initFlip(){
    if(flip) return;
    flip=new St.PageFlip($('book'),{size:'stretch',width:580,height:820,minWidth:290,maxWidth:842,minHeight:410,maxHeight:1191,drawShadow:true,flippingTime:900,usePortrait:true,autoSize:true,maxShadowOpacity:0.6,showCover:false,mobileScrollSupport:false,swipeDistance:30,clickEventForward:true,showPageCorners:true});
    flip.loadFromImages(IMAGES);
    flip.on('init',finishLoading); bindEvents(); buildThumbs(); setTimeout(finishLoading,4000);
  }
  let lh=false; function finishLoading(){ if(lh)return; lh=true; $('loader').classList.add('hidden'); }
  function buildThumbs(){ const rail=$('thumbRail'); rail.innerHTML=THUMBS.map((s,i)=>`<div class="thumb" data-page="${i}"><img src="${s}" alt="t" loading="lazy"></div>`).join(''); rail.querySelectorAll('.thumb').forEach(el=>el.addEventListener('click',()=>goToPage(+el.dataset.page))); }
  function updateUI(){ $('pageIndicator').textContent=`${currentPage+1} / ${TOTAL_PAGES}`; $('btnPrev').disabled=currentPage<=0; $('btnNext').disabled=currentPage>=TOTAL_PAGES-1; $('pageJump').max=TOTAL_PAGES; $('pageJump').value=currentPage+1; document.querySelectorAll('.thumb').forEach((el,i)=>el.classList.toggle('active',i===currentPage)); }
  function goToPage(p){ if(!flip||p<0||p>=TOTAL_PAGES)return; if(p===currentPage)return; flip.flip(p,'top'); }
  function handleJump(){ const n=parseInt($('pageJump').value,10); if(!isNaN(n)&&n>=1&&n<=TOTAL_PAGES)goToPage(n-1); }
  function openLightbox(p){ lightboxPage=p; lightboxZoom=1; $('lightboxImg').src=IMAGES[p]; $('lightboxTitle').textContent=`第 ${p+1} 页`; $('lightbox').classList.add('active'); applyZoom(); }
  function closeLightbox(){ $('lightbox').classList.remove('active'); }
  function applyZoom(){ $('lightboxImg').style.width=(lightboxZoom*100)+'vw'; $('zoomVal')&&($('zoomVal').textContent=Math.round(lightboxZoom*100)+'%'); }
  function setZoom(d){ lightboxZoom=Math.max(1,Math.min(4,lightboxZoom+d)); applyZoom(); }
  function bindEvents(){
    $('btnPrev').onclick=()=>flip&&flip.flipPrev(); $('btnNext').onclick=()=>flip&&flip.flipNext();
    $('btnZoom').onclick=()=>openLightbox(currentPage); $('btnFullscreen').onclick=()=>{const el=$('app'); if(!document.fullscreenElement)el.requestFullscreen&&el.requestFullscreen().catch(()=>{}); else document.exitFullscreen();};
    $('btnJump').onclick=handleJump; $('pageJump').addEventListener('keydown',e=>{if(e.key==='Enter')handleJump();});
    $('lbClose').onclick=closeLightbox; $('lbZoomIn').onclick=()=>setZoom(0.25); $('lbZoomOut').onclick=()=>setZoom(-0.25);
    $('lbPrev').onclick=()=>{if(lightboxPage>0)openLightbox(lightboxPage-1);}; $('lbNext').onclick=()=>{if(lightboxPage<TOTAL_PAGES-1)openLightbox(lightboxPage+1);};
    $('lightboxView').addEventListener('wheel',e=>{e.preventDefault();setZoom(e.deltaY>0?-0.15:0.15);},{passive:false});
    document.addEventListener('keydown',e=>{ if($('lightbox').classList.contains('active')){ if(e.key==='Escape')closeLightbox(); if(e.key==='ArrowLeft'&&lightboxPage>0)openLightbox(lightboxPage-1); if(e.key==='ArrowRight'&&lightboxPage<TOTAL_PAGES-1)openLightbox(lightboxPage+1);} else { if(e.key==='ArrowLeft')flip&&flip.flipPrev(); if(e.key==='ArrowRight')flip&&flip.flipNext(); } });
    flip.on('flip',e=>{currentPage=e.data;updateUI();});
  }
  preload().then(initFlip); setTimeout(initFlip,12000);
})();
</script>
</body></html>
